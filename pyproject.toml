# Project metadata and packaging for PANAM.
#
# The library is the package panam/, installed in editable (development) mode
# by the `-e .` line of requirements.txt, so `pip install -r requirements.txt`
# from the repository root installs the dependencies and makes `import panam`
# work from any directory.  Only panam/ is installed: the command-line tools in
# tools/ and the examples in examples/ are run as scripts from the checkout.
# The dependencies mirror requirements.txt; keep the two lists in step.  The
# pytest settings stay in pytest.ini.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "panam"
version = "0.1.0"
description = "Rotorcraft aeroacoustics: flight-test recordings to source noise spheres and NICEOPS databases"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Eric Greenwood" }]
dependencies = [
    "numpy",
    "h5py",
    "openpyxl",
    "scipy",
    "numba",
    "simplekml",
    "palettable",
    "matplotlib",
    "netCDF4",
    "pyuff",
    "pymap3d",
]

[project.optional-dependencies]
# requirements.txt also installs pytest, so one install serves CI and local runs.
test = ["pytest", "pytest-cov"]
# vold_kalman_filter's sparse fallback solve and solver='umfpack'.
umfpack = ["scikit-umfpack"]

[project.urls]
Repository = "https://github.com/PsuAeroacoustics/panam"

[tool.setuptools.packages.find]
include = ["panam", "panam.*"]

[tool.setuptools.package-data]
panam = ["data/*.csv", "acoustics/THIRD_PARTY_NOTICES.md"]

[tool.coverage.run]
# CI reports coverage of the modules and scripts, not of the tests.
# src/* is the path that Cython code in some binary wheels (netCDF4 on macOS)
# reports relative to the working directory; it has no source here.
omit = ["tests/*", "src/*"]

[tool.coverage.report]
# The CI summary is informational: an unreadable source file must not fail it.
ignore_errors = true
