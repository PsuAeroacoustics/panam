# Copy to local_paths.toml (git-ignored) and point each entry at this
# machine's copy.  Leave out what you do not have: scripts that need it stop
# with a message, and tests that need it are skipped.  Precedence: a path given
# on the command line, then the environment variable PANAM_<NAME> (e.g.
# PANAM_NORAH2), then this file.  See panam/local_paths.py for the details.

[paths]
# 2017 FAA/NASA Noise Abatement flight test archive (holds AS350B3/, B407/, ...).
# Used by tools/noise_abatement_2017.py (unless --root is given) and the track-check data tests.
noise_abatement_2017 = "/path/to/Noise_Abatement_2017"
# AS350 demo data (holds Acoustic/, Ambient/, AAM/ and Tracking/).
# Used by examples/AS350_289108_demo.py (unless --basepath is given).
as350_demo = "/path/to/AS350_demo"
# EASA NORAH2 public distribution (holds Hemispheres/). Used only by the NORAH2 tests.
norah2 = "/path/to/NORAH2_V2.0.74_public"
# NICEOPS executable. Used only by the tests that load PANAM-built databases in NICEOPS.
niceops = "/path/to/NICEOPS/build/niceops"
# NICEOPS ray-geometry executable. Used by refracted_rays.external_ray_model's tests.
niceops_ray_geometry = "/path/to/NICEOPS/build/niceops_ray_geometry"
# The B407 spheres shipped in the 2017 legacy Sphere_Database, whose PHI/THETA/FREQUENCY
# grids the 2017 release recipe (docs/recipes/release_2017.toml) builds on.
b407_legacy_spheres = "/path/to/Sphere_Database/Be407"
# Per-run NICEOPS atmosphere CSVs (<run>.csv, heights in ft) for the B407 runs, which the
# 2017 release recipe depropagates along refracted rays.  PANAM does not build them.
b407_ray_profiles = "/path/to/B407_ray_profiles"
