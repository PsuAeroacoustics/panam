[pytest]
# The modules live at the repository root, not in an installed package, so
# put it on sys.path: plain `pytest` then works as well as `python -m pytest`.
# tests/ is there too, for the shared helpers (sphere_helpers), so they import
# the same way under every import mode.
pythonpath = . tests
testpaths = tests
markers =
    data: reads an external dataset located through local_paths (minutes on a cold cloud drive); deselect with -m "not data"
