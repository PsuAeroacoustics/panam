[pytest]
# The repository root is on sys.path, so the tests import the panam package,
# and the scripts as `from tools import ...` and `from examples import ...`,
# from this checkout whether or not panam is installed: plain `pytest` then
# works as well as `python -m pytest`.  tests/ is there too, for the shared
# helpers (sphere_helpers), so they import the same way under every import mode.
pythonpath = . tests
testpaths = tests
markers =
    data: reads an external dataset located through local_paths (minutes on a cold cloud drive); deselect with -m "not data"
