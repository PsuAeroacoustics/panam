name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Print binary dependency versions
        run: |
          python - <<'PY'
          import platform, sys
          import numpy, scipy, h5py, netCDF4
          print('python:', sys.version.replace('\n', ' '))
          print('platform:', platform.platform())
          print('numpy:', numpy.__version__)
          print('scipy:', scipy.__version__)
          print('h5py:', h5py.__version__)
          print('hdf5 (h5py):', h5py.version.hdf5_version)
          print('netCDF4:', netCDF4.__version__)
          print('netcdf-c:', netCDF4.getlibversion())
          print('hdf5 (netCDF4):', getattr(netCDF4, '__hdf5libversion__', 'n/a'))
          PY

      - name: Run tests
        run: |
          python -m pytest -q

      - name: Upload test results (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-logs-${{ matrix.python-version }}
          path: ./.pytest_cache
          if-no-files-found: ignore
