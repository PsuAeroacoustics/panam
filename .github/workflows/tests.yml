name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  tests:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.14"]
        include:
          # One macOS job, on the newest supported Python.
          - os: macos-latest
            python-version: "3.14"
    env:
      # Numba's on-disk cache (ground_plane, axisymmetric_bem), kept between
      # runs by the cache step below instead of in __pycache__.
      NUMBA_CACHE_DIR: ${{ github.workspace }}/.numba_cache
      MPLBACKEND: Agg
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip install pytest-cov

      - name: Print binary dependency versions
        run: |
          python - <<'PY'
          import platform, sys
          import numpy, scipy, h5py, netCDF4, numba
          print('python:', sys.version.replace('\n', ' '))
          print('platform:', platform.platform())
          print('numpy:', numpy.__version__)
          print('scipy:', scipy.__version__)
          print('numba:', numba.__version__)
          print('h5py:', h5py.__version__)
          print('hdf5 (h5py):', h5py.version.hdf5_version)
          print('netCDF4:', netCDF4.__version__)
          print('netcdf-c:', netCDF4.getlibversion())
          print('hdf5 (netCDF4):', getattr(netCDF4, '__hdf5libversion__', 'n/a'))
          PY

      # Numba treats a cache as stale only when its source file's modification
      # time or size changes; a fresh checkout sets the time to now, and a fixed
      # time lets the restored cache match.  That is safe only for byte-identical
      # sources: Numba's per-function key hashes the bytecode alone, not its
      # constants, the globals or the njit functions it calls.  So the cache is
      # restored on an exact hash match only (no restore-keys), and any edit to
      # either file compiles from scratch.
      - name: Pin the Numba sources' timestamps
        run: touch -t 202001010000 panam/ground_plane.py panam/axisymmetric_bem.py

      - name: Restore the Numba cache
        uses: actions/cache@v4
        with:
          path: ${{ env.NUMBA_CACHE_DIR }}
          key: numba-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('panam/ground_plane.py', 'panam/axisymmetric_bem.py', 'requirements.txt') }}

      - name: Run tests
        run: |
          python -m pytest -q --durations=20 --cov=. --cov-report=term-missing:skip-covered

      # A summary only; no coverage threshold fails the job.
      - name: Coverage summary
        if: always()
        run: |
          if [ -f .coverage ]; then
            python -m coverage report --format=markdown --skip-covered >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test results (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-logs-${{ matrix.os }}-${{ matrix.python-version }}
          path: ./.pytest_cache
          include-hidden-files: true
          if-no-files-found: ignore
